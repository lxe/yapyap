[project]
name = "yapyap"
version = "0.1.0"
description = "Fast and simple push-to-talk dictation"
readme = "README.md"
authors = [
    { name = "Aleksey Smolenchuk", email = "lxe@lxe.co" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.0",
    "sounddevice>=0.5.2",
    "soundfile>=0.13.1",
    "scipy>=1.16.1",
    "pywhispercpp",
    "evdev>=1.9.2; sys_platform == 'linux'",
    "pynput>=1.7.6; sys_platform == 'darwin'",
    "torch>=2.8.0",
    "ml-dtypes>=0.5.0",
    "onnx",
    "nemo-toolkit[asr]",  # NeMo with ASR support
    # CUDA dependencies - only on Linux/Windows with CUDA support
    "cuda-python>=12.3,<13.0; sys_platform != 'darwin'",
    # MLX dependencies for Apple Silicon
    "mlx>=0.19.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "parakeet-mlx>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# CUDA support for Linux/Windows
cuda = [
    "cuda-python>=12.3,<13.0",
    "cupy-cuda12x>=12.0.0",
]
# MLX support for Apple Silicon
mlx = [
    "mlx>=0.19.0",
    "mlx-whisper>=0.2.0",
]
# NeMo/Parakeet support (heavy dependencies)
nemo = [
    "nemo-toolkit[asr]",
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
yapyap = "yapyap.yapyap:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
onnx = { git = "https://github.com/onnx/onnx.git" }
nemo-toolkit = { git = "https://github.com/NVIDIA/NeMo.git" }

[tool.uv.sources.pywhispercpp]
git = "https://github.com/lxe/pywhispercpp"

[tool.uv]
override-dependencies = [
    "numpy==2.2.0",
    "ml-dtypes>=0.5.0",
    "onnx",
    "nemo-toolkit[asr]",
    "protobuf>=4.25.1",
]
