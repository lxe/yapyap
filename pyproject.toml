[project]
name = "yapyap"
version = "0.2.0"
description = "Push-to-talk dictation for Linux with a self-hosted Whisper server"
readme = "README.md"
authors = [
    { name = "Aleksey Smolenchuk", email = "lxe@lxe.co" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
client = [
    "evdev>=2.0.0",
]
server = [
    "numpy>=2.5.4",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
]
openvino = [
    "yapyap[server]",
    "openvino-genai>=2026.4.1.0",
    "huggingface-hub>=2.4.0",
]
whispercpp = [
    "yapyap[server]",
    "pywhispercpp>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx2>=2.16.0",
]

[project.scripts]
yapyap = "yapyap.cli:main"
yapyap-server = "yapyap.server.app:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
