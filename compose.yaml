# Yap Yap server. Start one profile: intel, nvidia or cpu (see README.md).
# .env holds YAPYAP_TOKEN, and RENDER_GID for the Intel profile.

x-server: &server
  restart: unless-stopped
  ports:
    - "8122:8122"
  volumes:
    - models:/models

services:
  intel:
    <<: *server
    profiles: [intel]
    build:
      context: .
      dockerfile: docker/openvino.Dockerfile
    image: yapyap-server:openvino
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-render}"  # host group of /dev/dri/renderD128
    environment:
      YAPYAP_TOKEN: ${YAPYAP_TOKEN:-}
      YAPYAP_MODEL: ${YAPYAP_MODEL:-OpenVINO/whisper-large-v3-turbo-fp16-ov}

  cpu:
    <<: *server
    profiles: [cpu]
    build:
      context: .
      dockerfile: docker/whispercpp.Dockerfile
    image: yapyap-server:whispercpp
    environment:
      YAPYAP_TOKEN: ${YAPYAP_TOKEN:-}
      YAPYAP_MODEL: ${YAPYAP_MODEL:-large-v3-turbo-q8_0}

  nvidia:
    <<: *server
    profiles: [nvidia]
    build:
      context: .
      dockerfile: docker/whispercpp.Dockerfile
      args:
        CUDA: "1"
        BASE: nvidia/cuda:12.9.1-devel-ubuntu24.04
    image: yapyap-server:cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      YAPYAP_TOKEN: ${YAPYAP_TOKEN:-}
      YAPYAP_MODEL: ${YAPYAP_MODEL:-large-v3-turbo-q8_0}

volumes:
  models:
